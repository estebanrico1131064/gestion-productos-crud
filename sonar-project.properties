sonar.projectKey=estebanrico1131064_gestion-productos-crud
sonar.organization=estebanrico1131064
sonar.projectName=Gestion de Productos - CRUD Python
sonar.projectVersion=1.0

sonar.sources=.
sonar.sourceEncoding=UTF-8
